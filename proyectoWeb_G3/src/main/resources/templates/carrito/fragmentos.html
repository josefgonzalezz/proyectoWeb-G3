<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/plantilla :: head}">
    <title>La Vaca</title>
</head>
<body>
<section th:fragment="listadoProductos" id="productos">
    <div class="container">
        <div class="row row-cols-2">
            <h2 class="inline">[[#{index.nuestrosProductos}]]</h2>
            <div id="resultsBlock"></div>
        </div>
        <div class="row row-cols-3"
             th:if="${productos != null and !productos.empty}">
            <div class="card" th:each="producto : ${productos}">
                <div class="card-body">
                    <h5 class="card-title">[[${producto.descripcion}]]</h5>
                    <figure>
                        <img th:src="@{${producto.rutaImagen}}" height="200"/>
                        <figcaption>[[${producto.precio}+' ('+${producto.existencias}+')']]</figcaption>
                    </figure>
                    <form>
                        <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>
                        <input type="hidden" name="existencias" th:value="${producto.existencias}"/>
                        <button class="btn btn-light" id="addCar"
                                name="addCar" onclick="addCard(this.form)"
                                type="button"><i class="fas fa-cart-plus"></i></button>
                    </form>
                   
                    <p class="card-text">[[${producto.descripcion}]]</p>
                </div>
            </div>
        </div>
        <div th:if="${productos == null or productos.empty}">
            [[#{carrito.no_mostrar}]]
        </div>
    </div>
</section>


<div th:fragment="verCarrito">
    <div th:if="${listaItems != null and !#lists.isEmpty(listaItems)}">
        <form action="/carrito/listado" style="display: inline;">
            <button type="submit" class="btn btn-success btn-sm">
                <i class="fas fa-shopping-cart"></i>
                <span class="badge bg-danger rounded-pill ms-1" th:text="${listaTotal}">0</span>
            </button>
        </form>
    </div>

   
    <div th:if="${listaItems == null or #lists.isEmpty(listaItems)}">
        <span class="badge bg-secondary" th:text="${listaTotal ?: 0}">0</span>
        <small class="text-white ms-1">productos</small>
    </div>
</div>


<section th:fragment="listadoCarrito" id="items">
  <div class="container">
    <h2 class="text-center my-3">Carrito de compra</h2>
    <div class="d-flex gap-3">

      <div class="flex-grow-1">
        <div class="d-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr 0.5fr; font-weight: bold; border-bottom: 2px solid green; padding: 10px 0;">
          <span>Producto</span>
          <span>Nombre</span>
          <span>Cantidad</span>
          <span>Precio</span>
          <span></span>
        </div>

        <div th:each="item : ${items}" class="d-grid align-items-center" 
             style="grid-template-columns: 1fr 1fr 1fr 1fr 0.5fr; padding: 10px 0; border-bottom: 3px solid green;">
          
          <div>
            <img th:src="@{${item.rutaImagen}}" alt="Imagen" style="width: 80px; height: auto; border-radius: 5px;">
          </div>

          <div th:text="${item.descripcion}">Nombre producto</div>

          <div style="display: flex; align-items: center; gap: 5px;">
            <a th:href="@{/carrito/disminuir/{idProducto}(idProducto=${item.idProducto})}" 
               class="btn btn-sm btn-outline-danger" title="Disminuir cantidad">
              <i class="fas fa-minus"></i>
            </a>
            <span th:text="${item.cantidad}">1</span>
            <a th:href="@{/carrito/aumentar/{idProducto}(idProducto=${item.idProducto})}" 
               class="btn btn-sm btn-outline-success" title="Aumentar cantidad">
              <i class="fas fa-plus"></i>
            </a>
          </div>

          <div>
            <span th:text="'$' + ${item.precio}">$999</span>
          </div>

          <div class="text-end">
            <a th:href="@{/carrito/eliminar/{idProducto}(idProducto=${item.idProducto})}" 
               class="btn btn-sm btn-outline-danger" title="Eliminar producto">
              <i class="fas fa-trash"></i>
            </a>
          </div>
        </div>
      </div>

      <div style="flex: 1; align-self: flex-start;">
        <div style="background-color: #0a662d; color: white; border-radius: 10px; padding: 15px; text-align: center;">
          <div style="font-size: 1.2em; margin-bottom: 10px;">
            Subtotal: <span th:text="'$' + ${carritoTotal}">$999</span>
          </div>
          <a th:href="@{/facturar/carrito}" 
             style="display: inline-block; background-color: black; color: white; padding: 10px 15px; border-radius: 8px;">
            Proceder al pago
          </a>
        </div>
      </div>

    </div>
  </div>
</section>







<section th:fragment="modifica">
    <div class="row mb-3">
        <a th:href="@{/carrito/listado}" class="btn btn-primary">
            <i class="fas fa-reply"></i> Regresar
        </a>
    </div>
    <div class="row row-cols-2">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title" th:text="'Detalle: ' + ${item.descripcion}">Detalle</h5>
            </div>
            <div class="card-body">
                <h6 class="card-subtitle mb-2 text-muted text-end"
                    th:text="${item.precio} + ' (' + ${item.existencias} + ')'">Precio y Existencias</h6>
                <p class="card-text" th:text="${item.descripcion}">Descripción</p>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <figure>
                    <img th:src="@{${item.rutaImagen}}" width="120" alt="Imagen producto"/>
                </figure>
                <form th:action="@{/carrito/guardar}" method="post" th:object="${item}">
                    <input type="hidden" th:field="*{idProducto}"/>
                    <div class="form-group">
                        <label for="cantidad">Cantidad</label>
                        <input type="number" id="cantidad" th:field="*{cantidad}"
                               min="1" th:attr="max=${item.existencias}" required/>
                    </div>
                    <div class="form-group mt-2">
                        <button class="btn btn-success" type="submit" name="guardar">
                            <i class="fas fa-save"></i> Guardar
                        </button>
                    </div>
                </form>
                <a th:href="@{/carrito/eliminar/{id}(id=${item.idProducto})}" class="btn btn-danger mt-2">
                    <i class="fas fa-trash"></i> Eliminar
                </a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
